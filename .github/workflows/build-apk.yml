name: Build NIKA OMBREW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. NODE
      # ==========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ==========================================
      # 3. JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ==========================================
      # 4. FIND ZIP
      # ==========================================
      - name: Find NIKA OMBREW ZIP
        run: |
          echo "Mencari file ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 5. EXTRACT ZIP
      # ==========================================
      - name: Extract NIKA OMBREW source
        run: |
          rm -rf app_source
          mkdir -p app_source

          unzip -q "$ZIP_FILE" -d app_source/extracted

          echo "Isi hasil extract:"
          find app_source/extracted -maxdepth 3 -type f | head -100

      # ==========================================
      # 6. FIND INDEX.HTML
      # ==========================================
      - name: Locate web source
        run: |
          INDEX=$(find app_source/extracted \
            -type f \
            -name "index.html" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html tidak ditemukan di dalam ZIP"
            exit 1
          fi

          echo "index.html ditemukan:"
          echo "$INDEX"

          SOURCE_DIR=$(dirname "$INDEX")

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 7. COPY SOURCE
      # ==========================================
      - name: Prepare source directory
        run: |
          rm -rf app_source/web

          mkdir -p app_source/web

          cp -a "$SOURCE_DIR"/. app_source/web/

          echo "SOURCE WEB:"
          ls -la app_source/web

          test -f app_source/web/index.html
          echo "index.html OK"

      # ==========================================
      # 8. PACKAGE JSON
      # ==========================================
      - name: Prepare package
        working-directory: app_source
        run: |
          if [ ! -f package.json ]; then
            cat > package.json <<'EOF'
          {
            "name": "nika-ombrew-coffee",
            "version": "1.0.0",
            "private": true
          }
          EOF
          fi

          cat package.json

      # ==========================================
      # 9. INSTALL CAPACITOR
      # ==========================================
      - name: Install Capacitor
        working-directory: app_source
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets

      # ==========================================
      # 10. PREPARE WEB DIRECTORY
      # ==========================================
      - name: Prepare web directory
        working-directory: app_source
        run: |
          rm -rf www
          mkdir -p www

          cp -a web/. www/

          echo "WEB DIRECTORY:"
          find www -maxdepth 2 -type f | head -100

          test -f www/index.html
          echo "www/index.html OK"

      # ==========================================
      # 11. CAPACITOR CONFIG
      # ==========================================
      - name: Configure Capacitor
        working-directory: app_source
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nika.ombrewcoffee",
            "appName": "NIKA × OMBrew Coffee",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          cat capacitor.config.json

      # ==========================================
      # 12. ANDROID SAFE AREA
      # ==========================================
      - name: Fix Android safe area
        working-directory: app_source
        run: |
          cat >> www/style.css <<'EOF'

          /* =========================================
             NIKA OMBREW FINAL ANDROID SAFE AREA
             ========================================= */

          html,
          body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100%;
          }

          body {
            padding-top: env(safe-area-inset-top) !important;
            box-sizing: border-box;
          }

          /* BRAND */
          .topbar {
            padding-top: 22px !important;
            padding-bottom: 16px !important;
            min-height: 230px !important;
            box-sizing: border-box !important;
          }

          .brand {
            font-size: 34px !important;
            line-height: 1.05 !important;
          }

          .brand span {
            font-size: 31px !important;
          }

          /* HOME */
          main,
          .page {
            padding-bottom: 150px !important;
          }

          .product-grid,
          #menuList {
            padding-bottom: 100px !important;
          }

          /* LIHAT KERANJANG */
          .cart-mini {
            position: fixed !important;
            right: 16px !important;
            bottom: 100px !important;
            z-index: 200 !important;
          }

          /* DETAIL PRODUK */
          .sheet,
          .bottom-sheet,
          .product-sheet,
          .modal-sheet {
            padding-bottom: calc(
              120px + env(safe-area-inset-bottom)
            ) !important;
          }

          /* BOTTOM NAV */
          .bottom-nav {
            position: fixed !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 999 !important;
            padding-bottom: env(safe-area-inset-bottom) !important;
          }

          EOF

      # ==========================================
      # 13. PREPARE APK ICON
      # ==========================================
      - name: Prepare NIKA APK icon
        working-directory: app_source
        run: |
          mkdir -p resources

          cat > resources/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1024"
               height="1024"
               viewBox="0 0 1024 1024">

            <rect
              width="1024"
              height="1024"
              rx="220"
              fill="#073B70"/>

            <text
              x="512"
              y="475"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="250"
              font-weight="900"
              fill="#FFFFFF">
              NO
            </text>

            <text
              x="512"
              y="665"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="105"
              font-weight="700"
              letter-spacing="8"
              fill="#FFFFFF">
              COFFEE
            </text>

          </svg>
          EOF

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert \
            -background none \
            resources/icon.svg \
            resources/icon.png

          echo "ICON:"
          file resources/icon.png
          ls -lh resources/icon.png

      # ==========================================
      # 14. ANDROID SDK
      # ==========================================
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -perm -111 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 15. ADD ANDROID
      # ==========================================
      - name: Add Android platform
        working-directory: app_source
        run: |
          rm -rf android
          npx cap add android

      # ==========================================
      # 16. GENERATE ICON
      # ==========================================
      - name: Generate Android icons
        working-directory: app_source
        run: |
          npx capacitor-assets generate --android

      # ==========================================
      # 17. VERIFY ICON
      # ==========================================
      - name: Verify Android icon
        working-directory: app_source
        run: |
          echo "===== ICON FILES ====="

          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher*" \
              -o -name "ic_launcher_round*" \
            \) \
            -print

          echo ""
          echo "===== MANIFEST ====="

          grep -R \
            'android:icon\|android:roundIcon' \
            android/app/src/main/AndroidManifest.xml || true

      # ==========================================
      # 18. SYNC
      # ==========================================
      - name: Sync Capacitor
        working-directory: app_source
        run: |
          npx cap sync android

      # ==========================================
      # 19. BUILD APK
      # ==========================================
      - name: Build APK
        working-directory: app_source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ==========================================
      # 20. RENAME
      # ==========================================
      - name: Rename APK
        working-directory: app_source
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            NIKA-x-OMBreW-Coffee.apk

          ls -lh NIKA-x-OMBreW-Coffee.apk

      # ==========================================
      # 21. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-x-OMBreW-Coffee
          path: app_source/NIKA-x-OMBreW-Coffee.apk
