name: Build NIKA OMBREW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. SOURCE
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # 2. NODE
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # =========================
      # 3. JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # =========================
      # 4. ANDROID SDK
      # =========================
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -perm -111 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================
      # 5. INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          npm install

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

          npm install -D @capacitor/assets

      # =========================
      # 6. FORCE CAPACITOR CONFIG
      # =========================
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nika.ombrewcoffee",
            "appName": "NIKA × OMBrew Coffee",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF

      # =========================
      # 7. SAFE AREA FIX
      # =========================
      - name: Fix Android safe area
        run: |
          cat >> style.css <<'EOF'

          /* =========================================
             FINAL ANDROID SAFE AREA FIX
             ========================================= */

          html,
          body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100%;
          }

          body {
            padding-top: env(safe-area-inset-top) !important;
            box-sizing: border-box;
          }

          /* HEADER / BRAND */
          .topbar {
            padding-top: 22px !important;
            padding-bottom: 16px !important;
            min-height: 230px !important;
            box-sizing: border-box !important;
          }

          .brand {
            font-size: 34px !important;
            line-height: 1.05 !important;
          }

          .brand span {
            font-size: 31px !important;
          }

          /* CONTENT */
          main,
          .page {
            padding-bottom: 150px !important;
          }

          .product-grid,
          #menuList {
            padding-bottom: 100px !important;
          }

          /* CART FLOATING BUTTON */
          .cart-mini {
            position: fixed !important;
            right: 16px !important;
            bottom: 92px !important;
            z-index: 200 !important;
          }

          /* PRODUCT DETAIL SHEET */
          .sheet,
          .bottom-sheet,
          .product-sheet,
          .modal-sheet {
            padding-bottom: calc(
              110px + env(safe-area-inset-bottom)
            ) !important;
          }

          /* BOTTOM NAV */
          .bottom-nav {
            position: fixed !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 999 !important;
            padding-bottom: env(safe-area-inset-bottom) !important;
          }

          EOF

      # =========================
      # 8. CREATE APK ICON
      # =========================
      - name: Prepare NIKA APK icon
        run: |
          mkdir -p resources

          cat > resources/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1024"
               height="1024"
               viewBox="0 0 1024 1024">

            <rect
              x="0"
              y="0"
              width="1024"
              height="1024"
              rx="220"
              fill="#073B70"/>

            <text
              x="512"
              y="475"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="250"
              font-weight="900"
              fill="#FFFFFF">
              NO
            </text>

            <text
              x="512"
              y="665"
              text-anchor="middle"
              font-family="Arial, sans-serif"
              font-size="105"
              font-weight="700"
              letter-spacing="8"
              fill="#FFFFFF">
              COFFEE
            </text>

          </svg>
          EOF

          if command -v magick >/dev/null 2>&1; then
            magick resources/icon.svg resources/icon.png
          elif command -v convert >/dev/null 2>&1; then
            convert resources/icon.svg resources/icon.png
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            convert resources/icon.svg resources/icon.png
          fi

          file resources/icon.png
          ls -lh resources/icon.png

      # =========================
      # 9. CREATE ANDROID
      # =========================
      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      # =========================
      # 10. GENERATE ICONS
      # =========================
      - name: Generate Android icons
        run: |
          npx capacitor-assets generate --android

      # =========================
      # 11. FORCE APP ICON
      # =========================
      - name: Verify Android icon
        run: |
          echo "Checking generated Android icons..."

          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher*" -o -name "ic_launcher_round*" \) \
            -print

          grep -R "ic_launcher" \
            android/app/src/main/AndroidManifest.xml || true

      # =========================
      # 12. SYNC
      # =========================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # =========================
      # 13. BUILD APK
      # =========================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # =========================
      # 14. RENAME
      # =========================
      - name: Rename APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            NIKA-x-OMBreW-Coffee.apk

          ls -lh NIKA-x-OMBreW-Coffee.apk

      # =========================
      # 15. UPLOAD
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-x-OMBreW-Coffee
          path: NIKA-x-OMBreW-Coffee.apk
