name: Build NIKA OMBREW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract NIKA OMBREW source
        run: |
          rm -rf app_source
          mkdir app_source

          unzip -o NIKA-OMBREW-OFFLINE-LAYOUT-FIX-FINAL.zip -d app_source

          echo "=== PROJECT FILES ==="
          find app_source -maxdepth 2 -type f | sort

      - name: Install dependencies
        working-directory: app_source
        run: |
          npm install

      - name: Prepare Android icon
        working-directory: app_source
        run: |
          mkdir -p resources/icon

          if [ ! -f resources/icon/icon.png ]; then
            echo "ERROR: icon.png tidak ditemukan"
            exit 1
          fi

          file resources/icon/icon.png

      - name: Add Android platform
        working-directory: app_source
        run: |
          npx cap add android

      - name: Generate Android icons
        working-directory: app_source
        run: |
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: app_source
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: app_source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp app_source/android/app/build/outputs/apk/debug/app-debug.apk \
            NIKA-x-OMBreW-Coffee.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-x-OMBreW-Coffee
          path: NIKA-x-OMBreW-Coffee.apk
