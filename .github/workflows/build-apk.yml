name: Build NIKA OMBREW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract application
        run: |
          rm -rf app_source
          mkdir app_source
          unzip -o NIKA-OMBREW-OFFLINE-FINAL-SAFE-TOP.zip -d app_source

      - name: Install dependencies
        working-directory: app_source
        run: |
          npm install
          npm install -D typescript
          npm install -D @capacitor/assets

      - name: Prepare app icon
        working-directory: app_source
        run: |
          mkdir -p resources
          cp resources/icon/icon.png resources/icon.png
          file resources/icon.png

      - name: Add Android platform
        working-directory: app_source
        run: npx cap add android

      - name: Generate Android icons
        working-directory: app_source
        run: npx capacitor-assets generate --android

      - name: Sync application
        working-directory: app_source
        run: npx cap sync android

      - name: Build APK
        working-directory: app_source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp app_source/android/app/build/outputs/apk/debug/app-debug.apk NIKA-x-OMBreW-Coffee.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-x-OMBreW-Coffee
          path: NIKA-x-OMBreW-Coffee.apk
