name: Build NIKA OMBREW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. AMBIL SOURCE GITHUB
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # 2. NODE
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================
      # 3. JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # =========================
      # 4. CEK SOURCE
      # =========================
      - name: Check source files
        run: |
          echo "Isi repository:"
          ls -la

          echo ""
          echo "Cek index.html:"
          test -f index.html && echo "index.html OK" || exit 1

          echo ""
          echo "Cek style.css:"
          test -f style.css && echo "style.css OK" || exit 1

          echo ""
          echo "Cek app.js:"
          test -f app.js && echo "app.js OK" || exit 1

      # =========================
      # 5. BUAT PACKAGE.JSON
      # =========================
      - name: Prepare package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "nika-ombrew-coffee",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF

          echo "package.json dibuat:"
          cat package.json

      # =========================
      # 6. INSTALL
      # =========================
      - name: Install dependencies
        run: |
          npm install

          npx cap --version

      # =========================
      # 7. CAPACITOR CONFIG
      # =========================
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nika.ombrewcoffee",
            "appName": "NIKA × OMBrew Coffee",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF

          cat capacitor.config.json

      # =========================
      # 8. SAFE AREA FIX
      # =========================
      - name: Fix Android safe area
        run: |
          cat >> style.css <<'EOF'

          /* =========================================
             NIKA OMBREW FINAL ANDROID SAFE AREA
             ========================================= */

          html,
          body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            min-height: 100%;
          }

          body {
            padding-top: env(safe-area-inset-top) !important;
            box-sizing: border-box;
          }

          /* BRAND */
          .topbar {
            padding-top: 22px !important;
            padding-bottom: 16px !important;
            min-height: 230px !important;
            box-sizing: border-box !important;
          }

          .brand {
            font-size: 34px !important;
            line-height: 1.05 !important;
          }

          .brand span {
            font-size: 31px !important;
          }

          /* HOME */
          main,
          .
