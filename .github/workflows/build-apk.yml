name: Build NIKA OMBREW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract application
        run: |
          rm -rf app_source
          mkdir app_source
          unzip -o NIKA-OMBREW-OFFLINE-FINAL-SAFE-TOP.zip -d app_source

          PACKAGE_JSON=$(find app_source -type f -name package.json -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json tidak ditemukan di dalam ZIP"
            find app_source -maxdepth 3 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          if [ "$PROJECT_DIR" != "app_source" ]; then
            cp -a "$PROJECT_DIR"/. app_source/
          fi

          echo "Project root:"
          ls -la app_source

      - name: Install dependencies
        working-directory: app_source
        run: |
          npm install
          npm install -D typescript
          npm install -D @capacitor/assets

      - name: Prepare app icon
        working-directory: app_source
        run: |
          mkdir -p resources

          if [ -f resources/icon/icon.png ]; then
            cp resources/icon/icon.png resources/icon.png
          elif [ -f resources/icon.png ]; then
            echo "Icon sudah benar"
          else
            echo "Icon NO COFFEE tidak ditemukan"
            find resources -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

      - name: Add Android platform
        working-directory: app_source
        run: npx cap add android

      - name: Generate Android icons
        working-directory: app_source
        run: npx capacitor-assets generate --android

      - name: Sync application
        working-directory: app_source
        run: npx cap sync android

      - name: Build APK
        working-directory: app_source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp app_source/android/app/build/outputs/apk/debug/app-debug.apk NIKA-x-OMBreW-Coffee.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIKA-x-OMBreW-Coffee
          path: NIKA-x-OMBreW-Coffee.apk
