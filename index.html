<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1261d6" />
  <title>OMBREW COFFEE</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">OMBREW <span>COFFEE</span></div>
      <div class="tagline">Coffee & Beverage</div>
    </div>
    <button class="cart-mini" onclick="showPage('orders')">🛒 <b id="cartCount">0</b></button>
  </header>

  <main>
    <section id="home" class="page active">
      <div class="hero">
        <div>
          <div class="hero-kicker">WELCOME TO</div>
          <h1>OMBREW<br><span>COFFEE</span></h1>
          <p>Temukan minuman favoritmu. Fresh, creamy, dan siap menemani harimu.</p>
          <button class="primary-btn" onclick="showPage('menu')">Lihat Menu →</button>
        </div>
        <div class="cup-art">☕</div>
      </div>

      <h2>Menu Pilihan</h2>
      <div id="featured" class="product-grid"></div>
    </section>

    <section id="menu" class="page">
      <div class="section-head">
        <div>
          <div class="eyebrow">OUR MENU</div>
          <h1>Menu OMBREW</h1>
        </div>
      </div>
      <div class="categories">
        <button class="category active" onclick="filterMenu('all', this)">Semua</button>
        <button class="category" onclick="filterMenu('coffee', this)">Coffee</button>
        <button class="category" onclick="filterMenu('noncoffee', this)">Non-Coffee</button>
      </div>
      <div id="menuList" class="product-grid"></div>
    </section>

    <section id="orders" class="page">
      <div class="eyebrow">YOUR ORDER</div>
      <h1>Pesanan</h1>
      <div id="cart"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button onclick="showPage('home')" data-page="home"><span>⌂</span>Home</button>
    <button onclick="showPage('menu')" data-page="menu"><span>☕</span>Menu</button>
    <button onclick="showPage('orders')" data-page="orders"><span>🛒</span>Pesanan</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
